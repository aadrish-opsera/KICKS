title = "KICKS secret detection rules"

[[rules]]
id = "kicks-gemini-api-key"
description = "Gemini API key assignment with a non-placeholder value"
regex = '''(?i)GEMINI_API_KEY\s*=\s*(?!<your-)(?!["']?<)([^\s"']{12,})'''
keywords = ["GEMINI_API_KEY"]

[[rules]]
id = "kicks-sneaker-db-api-key"
description = "Sneaker DB API key assignment with a non-placeholder value"
regex = '''(?i)SNEAKER_DB_API_KEY\s*=\s*(?!<your-)(?!["']?<)([^\s"']{12,})'''
keywords = ["SNEAKER_DB_API_KEY"]

[[rules]]
id = "kicks-rapidapi-key"
description = "RapidAPI key assignment with a non-placeholder value"
regex = '''(?i)RAPIDAPI_KEY\s*=\s*(?!<your-)(?!["']?<)([^\s"']{12,})'''
keywords = ["RAPIDAPI_KEY"]

[[rules]]
id = "kicks-vercel-token"
description = "Vercel token assignment with a non-placeholder value"
regex = '''(?i)VERCEL_TOKEN\s*=\s*(?!<your-)(?!["']?<)([^\s"']{12,})'''
keywords = ["VERCEL_TOKEN"]

[[rules]]
id = "kicks-bearer-token"
description = "Bearer token in source"
regex = '''(?i)Bearer\s+[A-Za-z0-9\-_\.]{20,}'''
keywords = ["Bearer"]

[allowlist]
description = "Placeholder env examples and fake test fixtures"
paths = [
  '''\.env\.example$''',
  '''\.gitleaks\.toml$''',
  '''VULNERABILITY_TRIAGE\.md$''',
  '''.*test-fixtures.*''',
  '''.*__tests__/fixtures.*''',
]
regexes = [
  '''<your-[a-z0-9\-]+>''',
  '''test-fake-key-do-not-use''',
  '''test-api-key-12345''',
]

name: Lighthouse CI

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle size budget (≤200KB gzip JS)
        run: npm run test:perf:bundle
      - name: Run Lighthouse CI (simulated 4G, TTI ≤3s)
        run: npm run test:perf:lighthouse
      - name: Upload Lighthouse results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci
